# Prueba de CI/CD

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    # image: nginx:alpine
    # container_name: proxy_nginx_aprendices3
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #Http
      - "81:81" #Administracion de la Api
      - "443:443" #HTTPS
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
      
    depends_on:
      - app_backend
    networks:
      - red-cba
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:81 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd-aprendices3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5

  app_backend:
    image: laura2026cba/proyecto_aprendices3:latest
    container_name: app-backend-aprendices3

    volumes:
      - .:/home/myapp
    environment:
      FLASK_ENV: development
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - red-cba
    depends_on:
      - servidor-bd
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red-cba

networks:
  red-cba:
    name: red-cba-aprendices3

volumes:
  mysql-data:
    name: mysql-data-aprendices3
  uptime-kuma-data:
    name: uptime-kuma-data
